name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Sync Capacitor
        run: cd frontend && npx cap sync android

      - name: Build APK
        run: cd frontend/android && ./gradlew assembleDebug

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          name: FlatMate ${{ steps.version.outputs.tag }}
          body: |
            ## FlatMate ${{ steps.version.outputs.tag }}

            ### APK для Android
            Скачай файл `app-debug.apk` и установи на телефон.

            ### Как установить
            1. Скачай APK файл
            2. Открой на телефоне
            3. Разреши установку из неизвестных источников
            4. Установи приложение

            ### Как подключить к бэкенду
            APK работает с PWA версией приложения.
            Открой в браузере: https://desser121.github.io/flatmate-app/
