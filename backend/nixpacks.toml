[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements/base.txt"

[deploy]
startCommand = "cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
